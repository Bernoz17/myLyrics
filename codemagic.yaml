workflows:
  ios-altstore-build:
    name: myLyrics iOS Build (AltStore)
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: "15.4"
      cocoapods: default
    scripts:
      - name: Pulizia Workspace corrotto
        script: |
          rm -rf ios/Runner.xcworkspace
          rm -rf ios/Podfile.lock
      - name: Installa dipendenze Flutter
        script: flutter pub get
      - name: Compila app iOS (Unsigned)
        script: flutter build ios --release --no-codesign
      - name: Genera file IPA per AltStore
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -ry myLyrics.ipa Payload
    artifacts:
      - build/ios/iphoneos/myLyrics.ipa