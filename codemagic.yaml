workflows:
  ios-build:
    name: iOS Build - appFrasi
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Check iOS project
        script: |
          echo "=== iOS project ==="
          find ios -maxdepth 2 -type f | sort

          echo "=== Flutter version ==="
          flutter --version

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log