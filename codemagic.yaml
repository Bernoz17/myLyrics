workflows:
  ios-altstore-build:
    name: myLyrics iOS Build (AltStore)
    instance_type: mac_mini_m2
    environment:
      flutter: default
      cocoapods: default
    scripts:
      - name: Installa dipendenze Flutter
        script: flutter pub get
      - name: Compila app iOS (Unsigned)
        script: flutter build ios --release --no-codesign
      - name: Genera file IPA per AltStore
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -ry myLyrics.ipa Payload
    artifacts:
      - build/ios/iphoneos/myLyrics.ipa