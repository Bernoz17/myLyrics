workflows:
  ios-build:
    name: iOS Build - appFrasi
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Check iOS project
        script: |
          echo "=== iOS directory ==="
          ls -la ios

          echo "=== Podfile search ==="
          find . -name "Podfile" -print

          echo "=== Flutter version ==="
          flutter --version

      - name: Generate iOS dependencies
        script: |
          flutter pub get

          if [ ! -f ios/Podfile ]; then
            echo "Podfile not found after flutter pub get."
            echo "Flutter project structure:"
            find ios -maxdepth 2 -type f | sort
            exit 1
          fi

          cd ios
          pod install --repo-update

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log