workflows:
  ios-build:
    name: myLyrics + FrasiWidget + Supabase
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      groups:
        - supabase_config

    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Validate iOS project
        script: |
          set -e
          xcodebuild -project ios/Runner.xcodeproj -list
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = it.bernoz.mylyrics;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = it.bernoz.mylyrics.FrasiWidget;' ios/Runner.xcodeproj/project.pbxproj
          test -f ios/FrasiWidget/FrasiWidget.swift
          test -f ios/FrasiWidget/Info.plist

      - name: Inject Supabase configuration
        script: |
          set -e
          : "${SUPABASE_URL:?Add SUPABASE_URL to Codemagic environment variables}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Add SUPABASE_PUBLISHABLE_KEY to Codemagic environment variables}"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("ios/FrasiWidget/Info.plist")
          text = path.read_text()
          text = text.replace("__SUPABASE_URL__", os.environ["SUPABASE_URL"])
          text = text.replace(
              "__SUPABASE_PUBLISHABLE_KEY__",
              os.environ["SUPABASE_PUBLISHABLE_KEY"]
          )
          path.write_text(text)
          PY

      - name: Build iOS without code signing
        script: |
          set -e
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Package unsigned IPA
        script: |
          set -e
          rm -rf ipa_payload
          mkdir -p ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app ipa_payload/Payload/Runner.app
          cd ipa_payload
          /usr/bin/zip -qry ../myLyrics.ipa Payload

    artifacts:
      - myLyrics.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
