workflows:
  ios-build:
    name: iOS Build - appFrasi + FrasiWidget
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Validate iOS project and widget target
        script: |
          echo "=== Xcode targets ==="
          xcodebuild -project ios/Runner.xcodeproj -list

          echo "=== Widget files ==="
          test -f ios/FrasiWidget/FrasiWidget.swift
          test -f ios/FrasiWidget/Info.plist
          test -f ios/FrasiWidgetExtension.entitlements
          test -f ios/Runner/Runner.entitlements

          echo "=== Bundle identifiers ==="
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS app with widget target (no code signing)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
