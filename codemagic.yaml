workflows:
  ios-build:
    name: iOS Build + FrasiWidget + unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Validate iOS project and widget
        script: |
          set -e
          xcodebuild -project ios/Runner.xcodeproj -list
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = it.bernoz.mylyrics;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = it.bernoz.mylyrics.FrasiWidget;' ios/Runner.xcodeproj/project.pbxproj
          test -f ios/FrasiWidget/FrasiWidget.swift
          test -f ios/FrasiWidget/Info.plist
          test -f ios/FrasiWidget/frasi.json
          ! grep -q 'group.it.bernoz.myLyrics' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS without code signing
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e
          rm -rf ipa_payload
          mkdir -p ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app ipa_payload/Payload/Runner.app
          cd ipa_payload
          /usr/bin/zip -qry ../appFrasi.ipa Payload

    artifacts:
      - appFrasi.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
